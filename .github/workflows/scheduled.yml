name: Scheduled

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuilding game images"
        type: boolean
        default: false
        required: false
  schedule:
    - cron: "0 * * * *"

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game:
          - abiotic-factor
          - dont-starve-together
          - project-zomboid
          - stationeers
          - valheim
          - satisfactory
          - space-engineers
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      # Cache node_modules
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # build only updated games on schedule
      - run: pnpm eval build-game-image --game=${{ matrix.game }} --push ${{ inputs.force && '--force' || '' }}
        continue-on-error: true
