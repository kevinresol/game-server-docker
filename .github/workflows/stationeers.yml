name: Stationeers

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "**"
      - "!games/**"
      - "games/stationeers/**"

permissions:
  actions: read
  contents: read

jobs:
  build:
    timeout-minutes: 90
    uses: ./.github/workflows/push.yml
    secrets: inherit
    with:
      game: stationeers
